version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.6.11-management
    container_name: smart_city_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smart_city_network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  interscsimulator:
    build:
      context: ../..
    image: interscsimulator:latest
    container_name: interscsimulator_run
    working_dir: /src/mock-simulators/smart_city_model/src
    hostname: interscsimulator.com
    tty: true
    volumes:
      - ./output:/src/mock-simulators/smart_city_model/output
    environment:
      - USER=root
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
    networks:
      - smart_city_network
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
    driver: local

networks:
  smart_city_network:
    driver: bridge
